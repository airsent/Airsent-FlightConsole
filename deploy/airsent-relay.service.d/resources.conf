# The relay is the live telemetry path; the simulation stack is not. Under memory
# pressure on this 961 MB droplet the kernel had no reason to prefer either.
# Peak relay usage is ~24 MB.
[Service]
# Protection, not a cap: reclaim from other services before touching the relay.
MemoryLow=64M
# A generous ceiling, ~10x peak. This is a runaway-leak guard, not a squeeze —
# hitting it restarts the relay (Restart=always, 3 s) instead of OOMing the droplet.
MemoryMax=256M
# Make the kernel pick almost anything else first.
OOMScoreAdjust=-500
# Explicit priority: the simulation services sit at 10, the default is 100.
CPUWeight=200
