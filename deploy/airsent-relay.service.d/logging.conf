# Python block-buffers stdout when it is not a tty, so every print() in relay.py
# sat in a 4-8 KB buffer instead of reaching the journal. Connect/disconnect lines
# showed up minutes late or not at all, which makes the relay impossible to debug
# live. airsent-netlink.service already runs with -u; this matches it.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -u /root/relay.py
