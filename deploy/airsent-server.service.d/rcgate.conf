# Which RC channel is the aircraft's KILL SWITCH. The server writes RC<n>_OPTION=31
# (Motor Emergency Stop) from this, and mission_engine's rc_gate_arm check reads it:
# in SAFE the Pixhawk will not spin the motors. It is one of the few checks kept even
# in test mode (TEST_KEEP), so losing this value loses the kill switch.
# Channel 5 on the ZD650. Existed only on the Jetson's SD card until 2026-11-16.
[Service]
Environment=AIRSENT_RC_GATE_CHANNEL=5
