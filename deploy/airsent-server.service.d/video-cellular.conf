# Cellular video, measured on the aircraft 2026-11-16 (parked, strong signal).
#
# The committed default of 2000 kbps @ 20 fps was the WORST of the settings tested. At
# that cap the modem settles on NR n71 (600 MHz) — long reach, little capacity — cannot
# sustain even 2000, and the ABR keeps cutting: observed 2000 -> 1400 with only 352 kbps
# actually leaving the modem. Those cuts are the choppiness. Raising the cap moves the
# modem to n25, which has the capacity, and the stream then holds steady.
#
#   setting        load   server cpu   held its target?
#   2000 @ 20fps   3.48      211%      no — cut to 1400
#   4000 @ 25fps   3.61      205%      YES, rock steady
#   6000 @ 25fps   4.15      228%      no — cut, recovering
#   6000 @ 30fps   4.17      236%      yes
#   10000 @ 30fps  4.93      235%      no — fell back to ~6500
#
# 4000 @ 25 is the only one that held its target at no measurable CPU cost. ~6 Mbps is
# the edge of this link, and an ABR that keeps cutting is the thing we are removing.
#
# Bitrate costs CPU here, not frame rate: at 25 fps, 4000 -> 6000 is +0.54 load and
# +23% CPU, while at 6000, 25 -> 30 fps is +0.02 load. x264 does more work per frame as
# quantisation loosens. Do not "save CPU" by cutting fps; cut bitrate.
#
# GPS is unaffected at every level tested, including 10 Mbps: 22-26 satellites
# throughout, with the modem on USB 2.0. See LINK_ROUTING.md.
#
# Measured parked with RSRP -67 to -74 dBm. In flight, further out and moving, the ABR
# will cut below this — that is what it is for. AIRSENT_CELL_FRONT_START is left at its
# default so the stream climbs into the cap rather than starting above what the link has.
[Service]
Environment=AIRSENT_CELL_FRONT_MAX=4000
Environment=AIRSENT_CELL_FRONT_FPS=25
