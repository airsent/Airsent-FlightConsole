<!DOCTYPE html>
<html lang="en">
<head>
<script src="demo-isolation.js?v=viewer-1"></script>
<script src="viewer-access.js?v=shared-2"></script>
<script src="shared-state.js?v=1"></script>
<script src="console-local.js"></script>
<script src="console-config.js?v=simulation-map-4"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#01040c">
<title>Airsent Flight Console</title>
<link rel="preload" href="vendor/saira/saira-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Saira";
  src: url("vendor/saira/saira-latin-wdth-normal.woff2") format("woff2-variations");
  font-weight: 100 900; font-stretch: 50% 125%; font-display: swap;
}
:root {
  color-scheme: dark;
  --ink: #01040c;          /* page */
  --deep: #050e1e;         /* lift behind the mark */
  --mark-hi: #12294a;      /* the A, lit edge */
  --mark-lo: #050f1f;      /* the A, in shadow */
  --paper: #eaf0f9;
  --mist: rgba(234, 240, 249, .58);
  --rule: rgba(234, 240, 249, .22);
  --signal: #35e59b;
  --warn: #ffb35c;
  --bad: #ff9aa4;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--paper); overflow: hidden;
  font-family: "Saira", "Helvetica Neue", Arial, sans-serif; font-stretch: 104%;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
/* the field the mark stands in */
#field { position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(118vh 96vh at 76% 24%, var(--deep) 0%, rgba(5, 14, 30, .45) 42%, rgba(1, 4, 12, 0) 72%),
    linear-gradient(176deg, #030914 0%, #01040c 62%);
}
#grain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .045; pointer-events: none; }

/* AIRSENT's A, oversized: the diagonal is a climb */
#mark { position: fixed; right: 7vw; bottom: 22vh; height: 48vh; z-index: 0; pointer-events: none;
  transition: transform 1.1s cubic-bezier(.42, 0, .62, .2), opacity .7s ease-in; }
#mark svg { height: 100%; width: auto; display: block; overflow: visible; }
#edge { fill: none; stroke: rgba(126, 170, 224, .3); stroke-width: .55; }
#lit { fill: none; stroke: rgba(196, 224, 255, .82); stroke-width: .9; stroke-linecap: square; }
#sweep { fill: url(#beam); }
@keyframes climb { from { transform: translateX(-108px); opacity: 1; } 80% { opacity: 1; } to { transform: translateX(118px); opacity: 0; } }
@keyframes runner { from { stroke-dashoffset: 18px; } to { stroke-dashoffset: -164px; } }
#sweep { transform: translateX(-108px); }
body.lit #sweep { animation: climb 1.7s cubic-bezier(.4, 0, .5, 1) .35s both; }
#runner { fill: none; stroke: #f2f8ff; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 20 400; stroke-dashoffset: 18px; opacity: 0; filter: url(#halo); }
body.lit #runner { animation: runner 1.7s cubic-bezier(.4, 0, .5, 1) .35s both, fadeRunner 1.7s linear .35s both; }
body.launch #runner { animation: runner 1s cubic-bezier(.4, 0, .4, 1) both, fadeRunner 1s linear both; }
@keyframes fadeRunner { 0% { opacity: 0; } 12% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }
body.launch #sweep { animation: climb 1s cubic-bezier(.4, 0, .4, 1) both; }
body.launch #mark { transform: translate(14vh, -9vh); opacity: 0; }

.page { position: relative; z-index: 1; min-height: 100%; display: grid; grid-template-rows: auto 1fr auto;
  padding: clamp(22px, 4vw, 46px) clamp(22px, 6vw, 92px); transition: opacity .35s ease; }
body.launch .page { opacity: 0; }
.brand img { display: block; height: 23px; width: auto; opacity: .94; }

.gate { align-self: center; width: min(100%, 424px); padding-bottom: 5vh; }
h1 { margin: 0; font-weight: 560; font-stretch: 112%; font-size: clamp(30px, 4.2vw, 54px); line-height: 1.05;
     letter-spacing: -.012em; white-space: nowrap; }

form { margin-top: clamp(26px, 4.5vh, 40px); }
.field { position: relative; margin-bottom: 22px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--mist); margin-bottom: 2px; }
.field select {
  width: 100%; padding: 9px 30px 11px 0; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0;
  background: transparent; color: var(--paper); font: inherit; font-size: 19px; font-weight: 500;
  outline: none; cursor: pointer; appearance: none; -webkit-appearance: none;
}
.field select:hover { border-bottom-color: rgba(234, 240, 249, .45); }
.field select option { background: #08121f; color: var(--paper); }
.field select:invalid { color: var(--mist); font-weight: 400; }
.chev { position: absolute; right: 3px; bottom: 17px; width: 11px; height: 7px; pointer-events: none; fill: none;
  stroke: var(--mist); stroke-width: 1.6; }
.field:focus-within .chev { stroke: var(--paper); }
.field input {
  width: 100%; padding: 9px 44px 11px 0; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0;
  background: transparent; color: var(--paper); font: inherit; font-size: 19px; font-weight: 500;
  outline: none; caret-color: var(--signal); transition: border-color .15s;
}
.field input:hover { border-bottom-color: rgba(234, 240, 249, .45); }
.field::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--paper);
  transform: scaleX(0); transform-origin: left; transition: transform .28s cubic-bezier(.2, .7, .2, 1); }
.field:focus-within::after { transform: scaleX(1); }
.field:focus-within label { color: var(--paper); }
input:-webkit-autofill { -webkit-text-fill-color: var(--paper); transition: background-color 99999s; caret-color: var(--signal); }
.reveal { position: absolute; right: -6px; bottom: 5px; border: 0; background: none; color: var(--mist); font: inherit;
  font-size: 13px; padding: 6px 8px; cursor: pointer; border-radius: 4px; }
.reveal:hover { color: var(--paper); }
.caps { display: none; margin: -12px 0 16px; font-size: 13px; color: var(--warn); }
.caps.on { display: block; }

#errorMsg { display: none; color: var(--bad); font-size: 14px; line-height: 1.45; margin: -4px 0 14px; }
#errorMsg.visible { display: block; }
#loginBtn {
  width: 100%; margin-top: 8px; padding: 15px 18px; border: 0; border-radius: 3px; cursor: pointer;
  background: var(--paper); color: #040a18; font: inherit; font-size: 16px; font-weight: 600; font-stretch: 108%;
  transition: background .15s, transform .08s;
}
#loginBtn:hover { background: #fff; }
#loginBtn:active { transform: translateY(1px); }
#loginBtn:disabled { cursor: progress; background: rgba(234, 240, 249, .5); }
:is(#loginBtn, .reveal):focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.under { min-height: 22px; margin-top: 14px; font-size: 14px; }
#bootMessage { display: none; color: var(--paper); }
body.launch #bootMessage { display: block; }
.gate.shake { animation: shake .32s; }
@keyframes shake { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }

.foot { display: flex; justify-content: flex-end; gap: 16px; align-items: center; font-size: 13px; color: var(--mist); }
body.launch .foot { visibility: hidden; }
#zulu { font-variant-numeric: tabular-nums; }
#bootOverlay, #bootProgressFill { display: none; }

@media (max-width: 820px) {
  .brand img { height: 18px; }
  #mark { height: 16vh; right: 9vw; bottom: auto; top: 19vh; }
  .gate { align-self: end; padding-bottom: 4vh; }
  .foot #zulu { display: none; }
}
@media (max-height: 560px) { form { margin-top: 20px; } #mark { height: 44vh; bottom: 14vh; } }
@media (prefers-reduced-motion: reduce) {
  #mark, .page, .field::after { transition: none; }
  body.lit #sweep, body.launch #sweep { animation: none; }
  body.launch #mark { transform: none; }
  .gate.shake { animation: none; }
}
</style>
</head>
<body>
<div id="field"></div>
<svg id="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

<div id="mark" aria-hidden="true">
  <svg viewBox="0 0 145 80" fill="none">
    <defs>
      <!-- the mark, lit from the upper left -->
      <linearGradient id="body" x1="0" y1="80" x2="145" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#040c1a"/><stop offset=".5" stop-color="#0d2140"/><stop offset="1" stop-color="#17355c"/>
      </linearGradient>
      <filter id="halo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8fc0ff" stop-opacity="0"/>
        <stop offset=".46" stop-color="#cfe4ff" stop-opacity=".42"/>
        <stop offset=".54" stop-color="#eaf4ff" stop-opacity=".62"/>
        <stop offset="1" stop-color="#8fc0ff" stop-opacity="0"/>
      </linearGradient>
      <path id="a" d="M0.4 79 L120.3 1.2 Q121.6 0 123.6 0 L135 0 A9 9 0 0 1 144 9 L144 79 L124 79 L124 20.2 L33 79 Z"/>
      <clipPath id="clip"><use href="#a"/></clipPath>
    </defs>
    <use href="#a" fill="url(#body)"/>
    <g clip-path="url(#clip)">
      <g transform="rotate(-32.9 72.5 40)"><rect id="sweep" x="-26" y="-190" width="52" height="420"/></g>
    </g>
    <use href="#a" id="edge"/>
    <path id="lit" d="M0.4 79 L120.3 1.2 M135 0 A9 9 0 0 1 144 9"/>
    <path id="runner" d="M0.4 79 L120.3 1.2"/>
  </svg>
</div>

<div class="page">
  <header class="brand"><img src="logo-topbar.png" alt="Airsent"></header>

  <main class="gate" id="gate">
    <h1>Flight console</h1>

    <form id="signin" novalidate onsubmit="return false">
      <div class="field">
        <label for="username">Account</label>
        <select id="username" name="username" autocomplete="username" required>
          <option value="" disabled selected>Select account</option>
          <option value="operator">Operator</option>
          <option value="viewer">Viewer</option>
          <option value="simulation">Simulator</option>
          <option value="demo">Demo</option>
        </select>
        <svg class="chev" viewBox="0 0 11 7" aria-hidden="true"><path d="M.8 1.1 5.5 5.8 10.2 1.1"/></svg>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button type="button" class="reveal" id="reveal" aria-pressed="false" aria-controls="password">Show</button>
      </div>
      <div class="caps" id="caps">Caps Lock is on.</div>
      <div id="errorMsg" role="alert"></div>
      <button id="loginBtn" type="button">Sign in</button>
      <div class="under" aria-live="polite"><div id="bootMessage"></div></div>
    </form>
  </main>

  <footer class="foot">
    <span id="zulu" title="Coordinated Universal Time, the clock the flight log uses"></span>
  </footer>
</div>

<div id="bootOverlay" class="hidden"><div id="bootProgressFill"></div></div>
<script src="login.js?v=simulation-map-2"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  requestAnimationFrame(() => document.body.classList.add('lit'));

  $('reveal').onclick = () => {
    const show = $('password').type === 'password';
    $('password').type = show ? 'text' : 'password';
    $('reveal').textContent = show ? 'Hide' : 'Show';
    $('reveal').setAttribute('aria-pressed', String(show));
    $('password').focus();
  };
  const caps = e => { if (e.getModifierState) $('caps').classList.toggle('on', e.getModifierState('CapsLock')); };
  $('password').addEventListener('keydown', caps); $('password').addEventListener('keyup', caps);
  $('username').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('password').focus(); } });
  $('username').addEventListener('change', () => $('password').focus());
  $('username').focus();

  // login.js listens on document in the capture phase; window runs first, so the guard lands ahead of it
  const noAccount = () => {
    const e = $('errorMsg');
    e.textContent = 'Pick an account to sign in to.'; e.classList.add('visible');
    $('username').focus();
  };
  addEventListener('click', e => {
    if (e.target.closest?.('#loginBtn') && !$('username').value) { e.preventDefault(); e.stopImmediatePropagation(); noAccount(); }
  }, true);
  addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'password' && !$('username').value) { e.preventDefault(); e.stopImmediatePropagation(); noAccount(); }
  }, true);

  // login.js owns the sign-in; say its outcomes in the page's own voice
  const say = {
    'INVALID USERNAME OR PASSWORD': 'That username or password is not right. Check both and try again.',
    'Sign-in service unavailable. Please try again.': 'The sign-in service did not answer. Check your connection and try again.',
    'Cannot reach the sign-in service. Please try again.': 'Cannot reach the sign-in service. Check your connection and try again.',
    'Sign-in connection closed. Please try again.': 'The connection dropped during sign-in. Try again.',
  };
  new MutationObserver(() => {
    const el = $('errorMsg'), t = el.textContent.trim();
    if (say[t]) { el.textContent = say[t]; return; }
    if (el.classList.contains('visible')) {
      $('gate').classList.remove('shake'); void $('gate').offsetWidth; $('gate').classList.add('shake');
      $('password').select();
    }
  }).observe($('errorMsg'), { childList: true, attributes: true, attributeFilter: ['class'], characterData: true, subtree: true });
  new MutationObserver(() => { $('loginBtn').textContent = $('loginBtn').disabled ? 'Signing in' : 'Sign in'; })
    .observe($('loginBtn'), { attributes: true, attributeFilter: ['disabled'] });
  new MutationObserver(() => { if (!$('bootOverlay').classList.contains('hidden')) document.body.classList.add('launch'); })
    .observe($('bootOverlay'), { attributes: true, attributeFilter: ['class'] });

  const pad = n => String(n).padStart(2, '0');
  const tick = () => { const d = new Date(); $('zulu').textContent = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`; };
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
